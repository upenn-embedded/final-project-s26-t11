<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gimbal Control</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: #eee;
        }
        h1 { margin-bottom: 2rem; }
        #gimbal-btn {
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #gimbal-btn.enabled  { background: #4caf50; color: #fff; }
        #gimbal-btn.disabled { background: #444;    color: #aaa; }
        #gimbal-btn:active { transform: scale(0.96); }
        #status { margin-top: 1rem; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>
    <h1>Gimbal Control</h1>
    <button id="gimbal-btn" class="{{ 'enabled' if gimbal_enabled else 'disabled' }}">
        Gimbal {{ 'ENABLED' if gimbal_enabled else 'DISABLED' }}
    </button>
    <p id="status"></p>

    <script>
        const btn = document.getElementById('gimbal-btn');
        const status = document.getElementById('status');

        function updateUI(enabled) {
            btn.className = enabled ? 'enabled' : 'disabled';
            btn.textContent = enabled ? 'Gimbal ENABLED' : 'Gimbal DISABLED';
        }

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = 'Sending…';
            try {
                const res = await fetch('/toggle_gimbal', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    updateUI(data.gimbal_enabled);
                    status.textContent = '';
                } else {
                    status.textContent = 'Error: ' + data.error;
                }
            } catch (e) {
                status.textContent = 'Request failed: ' + e;
            }
            btn.disabled = false;
        });
        setInterval(async () => {
            try {
                const res = await fetch('/state');
                const data = await res.json();
                if (data.success) {
                    updateUI(data.gimbal_enabled);
                }
            } catch (_) {}
        }, 500);
    </script>
</body>
</html>
