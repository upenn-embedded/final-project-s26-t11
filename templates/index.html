<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LED Control</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: #eee;
        }
        h1 { margin-bottom: 2rem; }
        #led-btn {
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        #led-btn.off  { background: #444; color: #aaa; }
        #led-btn.on   { background: #f5c518; color: #111; }
        #led-btn:active { transform: scale(0.96); }
        #status { margin-top: 1rem; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>
    <h1>LED Control</h1>
    <button id="led-btn" class="{{ 'on' if led_on else 'off' }}">
        LED {{ 'ON' if led_on else 'OFF' }}
    </button>
    <p id="status"></p>

    <script>
        const btn = document.getElementById('led-btn');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = 'Sending…';
            try {
                const res = await fetch('/toggle_led', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    btn.className = data.led_on ? 'on' : 'off';
                    btn.textContent = data.led_on ? 'LED ON' : 'LED OFF';
                    status.textContent = '';
                } else {
                    status.textContent = 'Error: ' + data.error;
                }
            } catch (e) {
                status.textContent = 'Request failed: ' + e;
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
